name: Upsight
description: Upsight was a mobile analytics and marketing platform for apps and
  games — positioning itself as a "user lifecycle management platform" combining
  omnichannel analytics, integrated web and mobile marketing, ad optimization, and
  a DataMine SQL analytics product behind a single SDK for iOS, Android, tvOS,
  Unity, and Web. A Battery Ventures portfolio company, the platform is now
  defunct - upsight.com no longer resolves, the help.upsight.com developer docs
  survive only in the Internet Archive, and the GitHub org has been dormant since
  2020, though the UpsightKit CocoaPods SDK and the doctor PyPI package remain
  published.
